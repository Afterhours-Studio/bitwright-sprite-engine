[package]
name = "bitwright"
version = "0.1.1"
description = "Cross-platform sprite generation engine for pixel art games"
authors = ["Afterhours Studio"]
license = "AGPL-3.0-only"
repository = "https://github.com/Afterhours-Studio/bitwright-sprite-engine"
homepage = "https://github.com/Afterhours-Studio/bitwright-sprite-engine"
edition = "2021"
rust-version = "1.77"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Sprites arrive from the sidecar as data URLs, so the asset protocol is not
# enabled and the webview needs no filesystem reach.
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
url = "2"
tauri-plugin-log = "2"
# The directory picker has to be the system's own dialog. Weights are
# gigabytes, so the user has to be able to point them at a real volume, and a
# text field cannot browse one.
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v7", "serde"] }
thiserror = "2"
tokio = { version = "1", features = ["sync", "time", "macros", "rt-multi-thread", "net", "io-std", "signal"] }
# Loopback only, so no TLS backend is compiled in.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
log = "0.4"
window-vibrancy = "0.5"
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-io", "transport-streamable-http-server"] }
axum = { version = "0.8.4", default-features = false, features = ["tokio", "http1"] }
dirs = "7.0.0"
rand = "0.9.5"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-window-state = "2"

[features]
# Enabled by tauri-cli for production builds.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
