name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, synchronize, reopened, closed]

permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write

jobs:
  cla:
    name: Contributor License Agreement
    runs-on: ubuntu-latest
    # The bot reacts to its own trigger phrase in a comment, and to pull request
    # events. Anything else would run the action for no reason.
    if: >
      (github.event.issue.pull_request &&
       contains(github.event.comment.body, 'I have read the CLA Document and I hereby sign the CLA')) ||
      github.event_name == 'pull_request_target'
    steps:
      - name: Check or record the signature
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # A token for the repository that stores signatures. Signatures are
          # kept outside this repository so that they survive a history rewrite
          # and are not editable by anyone with write access here.
          PERSONAL_ACCESS_TOKEN: ${{ secrets.CLA_SIGNATURES_TOKEN }}
        with:
          branch: main
          path-to-signatures: signatures/bitwright-sprite-engine.json
          path-to-document: https://github.com/Afterhours-Studio/bitwright-sprite-engine/blob/main/CONTRIBUTING.md#contributor-license-agreement
          remote-organization-name: Afterhours-Studio
          remote-repository-name: cla-signatures

          # Copyright in a contribution is assigned to Afterhours Studio, the
          # organization, and never to an individual maintainer. See the
          # reasoning in CONTRIBUTING.md.
          custom-notsigned-prcomment: >
            Thank you for the contribution. Before it can be merged, please sign
            the Contributor License Agreement, which assigns copyright in your
            contribution to Afterhours Studio. Read it in
            [CONTRIBUTING.md](https://github.com/Afterhours-Studio/bitwright-sprite-engine/blob/main/CONTRIBUTING.md#contributor-license-agreement),
            then post the comment below on this pull request.
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: >
            All contributors have signed the CLA. Copyright in this contribution
            is assigned to Afterhours Studio.

          # Bots cannot enter a legal agreement, so they are not asked to.
          allowlist: dependabot[bot],github-actions[bot]

          lock-pullrequest-aftermerge: false
