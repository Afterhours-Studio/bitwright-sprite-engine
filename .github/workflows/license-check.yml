name: License check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # A dependency can change its licence in a release, and a weekly run
    # catches that without waiting for the next pull request.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  licenses:
    name: Dependency licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/engine[dev]"

      # Fails the build on a dependency whose licence is incompatible with
      # AGPL-3.0-only, and on one that declares no licence at all. The policy
      # and the allowlist live in the script.
      - name: Scan dependency licences
        run: python scripts/check-licenses.py

      - name: Write the full report
        if: always()
        run: python scripts/check-licenses.py --report > license-report.txt || true

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: license-report
          path: license-report.txt
          retention-days: 30
