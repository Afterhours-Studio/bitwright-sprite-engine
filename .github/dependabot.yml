version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: [dependencies, javascript]
    commit-message:
      prefix: build
      include: scope
    groups:
      # One pull request per ecosystem for the routine bumps, so review time
      # goes to the updates that actually change behaviour.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /packages/engine
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: [dependencies, python]
    commit-message:
      prefix: build
      include: scope
    groups:
      python-dependencies:
        update-types: [minor, patch]
    ignore:
      # Torch releases are large and are pinned to a CUDA build, so they are
      # upgraded deliberately rather than automatically.
      - dependency-name: torch
        update-types: [version-update:semver-major, version-update:semver-minor]

  - package-ecosystem: cargo
    directory: /apps/desktop/src-tauri
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels: [dependencies, rust]
    commit-message:
      prefix: build
      include: scope
    groups:
      rust-dependencies:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 3
    labels: [dependencies, ci]
    commit-message:
      prefix: ci
      include: scope
