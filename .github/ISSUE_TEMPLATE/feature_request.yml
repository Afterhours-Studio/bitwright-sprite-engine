name: Feature request
description: Suggest new functionality
title: 'feat: '
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: >
        Open this before writing code. A maintainer will agree the approach with
        you, so that a large pull request is not declined for a reason that has
        nothing to do with its quality.

  - type: checkboxes
    id: preflight
    attributes:
      label: Before requesting
      options:
        - label: I searched the existing issues and the roadmap, and did not find this.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do that is hard or impossible today? Describe the
        problem rather than the solution you have in mind.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would like the application to do.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, and why they are worse.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Generation
        - Post-processing
        - Engines and backends
        - Models
        - User interface
        - Translations
        - Documentation
        - Build and packaging
    validations:
      required: true

  - type: dropdown
    id: backends
    attributes:
      label: Which engines would this apply to?
      multiple: true
      options:
        - Local GPU (NVIDIA)
        - Local GPU (Apple)
        - Remote API

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution
      options:
        - label: I am willing to open a pull request for this.

  - type: checkboxes
    id: conduct
    attributes:
      label: Code of Conduct
      options:
        - label: I agree to follow this project's Code of Conduct.
          required: true
