[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The version lives in the module, not here. Two copies of a version number
# drift, and the one that drifts is always the one the user is shown.
[tool.hatch.version]
path = "bitwright_engine/version.py"

[project]
name = "bitwright-engine"
dynamic = ["version"]
description = "Cross-platform sprite generation engine for pixel art games"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Afterhours Studio" }]
maintainers = [{ name = "h1dr0n" }]
keywords = ["pixel-art", "sprite", "diffusion", "game-development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: GPU :: NVIDIA CUDA",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "httpx>=0.27",
    "pillow>=11.0",
    "psutil>=6.1",
    # API keys belong in the operating system credential store, not in a JSON
    # file beside the preferences. keyring is the portable way to reach
    # Windows Credential Manager, the macOS Keychain, and a Linux Secret
    # Service, and it is pure Python with no compiled extension. MIT licensed,
    # as are its jaraco.* and more-itertools dependencies; the Windows backend
    # rides on pywin32-ctypes, BSD-3-Clause. All compatible with AGPL-3.0-only.
    "keyring>=25.5",
]

[project.optional-dependencies]
cuda = ["torch>=2.5", "diffusers>=0.31", "transformers>=4.46", "safetensors>=0.4", "numpy>=2.0"]
mps = ["torch>=2.5", "diffusers>=0.31", "transformers>=4.46", "safetensors>=0.4", "numpy>=2.0"]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
    "mypy>=1.13",
    "types-psutil>=6.1",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/Afterhours-Studio/bitwright-sprite-engine"
Repository = "https://github.com/Afterhours-Studio/bitwright-sprite-engine"
Issues = "https://github.com/Afterhours-Studio/bitwright-sprite-engine/issues"
Changelog = "https://github.com/Afterhours-Studio/bitwright-sprite-engine/blob/main/CHANGELOG.md"

[project.scripts]
bitwright-engine = "bitwright_engine.api.server:main"

[tool.hatch.build.targets.wheel]
packages = ["bitwright_engine"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["bitwright_engine", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific
    "D",    # pydocstyle
    "ANN",  # flake8-annotations
]
ignore = [
    "D203",  # conflicts with D211
    "D213",  # conflicts with D212
]

[tool.ruff.lint.isort]
known-first-party = ["bitwright_engine", "tests"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D100", "D101", "D102", "D103", "D107", "ANN201"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
warn_unused_ignores = true
disallow_any_explicit = false
show_error_codes = true
files = ["bitwright_engine", "tests"]

[[tool.mypy.overrides]]
module = ["torch.*", "diffusers.*", "transformers.*"]
ignore_missing_imports = true

# Pillow references numpy in type positions. Nothing here imports it, and it
# arrives only with the cuda and mps extras, so it is treated as optional.
[[tool.mypy.overrides]]
module = ["numpy.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
